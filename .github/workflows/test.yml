name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: Test (${{ matrix.mpi }}, ${{ matrix.features == '' && 'default' || matrix.features }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        mpi: [mpich, openmpi]
        features: ["", "rma"]
        include:
          - mpi: mpich
            np_list: "2 3 4"
          - mpi: openmpi
            pkg: libopenmpi-dev openmpi-bin
            np_list: "4"

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ runner.os }}-cargo-${{ matrix.mpi }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ matrix.mpi }}-
            ${{ runner.os }}-cargo-

      - name: Cache cargo build
        uses: actions/cache@v5
        with:
          path: target
          key: ${{ runner.os }}-target-${{ matrix.mpi }}-${{ matrix.features }}-${{ hashFiles('**/Cargo.lock') }}-${{ hashFiles('**/*.rs') }}
          restore-keys: |
            ${{ runner.os }}-target-${{ matrix.mpi }}-${{ matrix.features }}-${{ hashFiles('**/Cargo.lock') }}-
            ${{ runner.os }}-target-${{ matrix.mpi }}-${{ matrix.features }}-
            ${{ runner.os }}-target-${{ matrix.mpi }}-

      - name: Install MPI (Open MPI)
        if: matrix.mpi == 'openmpi'
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.pkg }} pkg-config
          mpiexec --version

      - name: Setup MPICH
        if: matrix.mpi == 'mpich'
        uses: ./.github/actions/setup-mpich

      - name: MPICH hotfix fixture test
        if: matrix.mpi == 'mpich'
        run: bash .github/scripts/mpich-hotfix-test.sh

      - name: Release-notes fixture test
        if: matrix.mpi == 'mpich' && matrix.features == ''
        run: bash .github/scripts/release-notes-test.sh

      - name: Plan-structure leak gate
        if: matrix.mpi == 'mpich' && matrix.features == ''
        run: |
          bash .github/scripts/check-no-plan-leaks-test.sh
          bash .github/scripts/check-no-plan-leaks.sh

      - name: Configure OpenMPI environment
        if: matrix.mpi == 'openmpi'
        run: |
          {
            echo "OMPI_MCA_rmaps_base_oversubscribe=1"
            echo "OMPI_ALLOW_RUN_AS_ROOT=1"
            echo "OMPI_ALLOW_RUN_AS_ROOT_CONFIRM=1"
            echo "OMPI_MCA_btl=self,tcp"
            # The runner's docker0 + NAT rule gives Open MPI 4.1's TCP BTL a second,
            # misrouted path to same-host peers; persistent sends then hang.
            echo "OMPI_MCA_btl_tcp_if_include=lo"
          } >> "$GITHUB_ENV"

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy (default features)
        run: cargo clippy --all-targets -- -D warnings

      - name: Clippy (with ${{ matrix.features }} features)
        if: matrix.features != ''
        run: cargo clippy --all-targets --features ${{ matrix.features }} -- -D warnings

      - name: Clippy (numa feature)
        if: matrix.mpi == 'mpich' && matrix.features == 'rma'
        run: cargo clippy --all-targets --features numa -- -D warnings

      - name: Unit tests
        run: cargo test --lib --features numa --verbose

      - name: Build examples
        run: cargo build --examples --features "${{ matrix.features }}"

      - name: Runner self-test
        run: bash tests/runner_selftest.sh

      - name: Build-script probe test
        if: matrix.mpi == 'mpich' && matrix.features == ''
        run: bash tests/build_probe.sh

      - name: MPI integration tests
        run: |
          chmod +x tests/run_mpi_tests.sh
          MPI_NP_LIST="${{ matrix.np_list }}" ./tests/run_mpi_tests.sh "${{ matrix.features }}"

  test-openmpi5:
    name: Test (openmpi5, rma)
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    container:
      image: debian:trixie@sha256:9cc080028c43b27d2074d63a5f9caf7166d731494965616c1a6d2827a004585c # trixie, resolved 2026-09-25
      options: --shm-size=1g --cap-add=SYS_PTRACE

    env:
      OMPI_ALLOW_RUN_AS_ROOT: 1
      OMPI_ALLOW_RUN_AS_ROOT_CONFIRM: 1

    steps:
      - name: Install OpenMPI and build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends openmpi-bin libopenmpi-dev pkg-config build-essential ca-certificates curl git jq

      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ runner.os }}-cargo-openmpi5-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-openmpi5-

      - name: Check MPI version
        run: mpiexec --version

      - name: MPI integration tests (rma)
        run: MPI_NP_LIST=4 ./tests/run_mpi_tests.sh rma

      - name: Receive pending after a process failure aborts (ULFM)
        shell: bash
        run: |
          cargo build --example ulfm_pending
          for mode in wait wait_all wait_any; do
            out=$(mpiexec --with-ft ulfm -n 3 target/debug/examples/ulfm_pending "$mode" 2>&1 || true)
            printf '%s\n' "$out"
            grep -qF 'ferrompi: receive pending after a process failure' <<<"$out"
            if grep -qF 'FAIL: ' <<<"$out"; then exit 1; fi
          done

  msrv:
    name: MSRV (1.85)
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.85

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ runner.os }}-cargo-msrv-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-msrv-

      - name: Setup MPICH
        uses: ./.github/actions/setup-mpich

      - name: Build lib, tests and examples
        run: cargo build --locked --all-features --lib --tests --examples

  abi-stubs:
    name: MPI ABI stubs
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Checkout MPI Forum ABI stubs
        uses: actions/checkout@v6
        with:
          repository: mpi-forum/mpi-abi-stubs
          ref: 3ab68bc2c456816ef3b8a5b755ea0155bbf6bae2
          path: mpi-abi-stubs

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ runner.os }}-cargo-abi-stubs-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-abi-stubs-

      - name: Build and install the ABI stubs
        run: make -C mpi-abi-stubs install PREFIX="$RUNNER_TEMP/mpi-abi"

      - name: Build examples against the ABI stubs
        run: cargo build --locked --features rma --examples
        env:
          MPICC: ${{ runner.temp }}/mpi-abi/bin/mpicc_abi

  large-count:
    name: Large count (mpich)
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ runner.os }}-cargo-large-count-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-large-count-

      - name: Setup MPICH
        uses: ./.github/actions/setup-mpich

      - name: Build the large-count example
        run: cargo build --locked --release --features rma --example large_count

      - name: Run the large-count example
        run: mpiexec -n 1 target/release/examples/large_count

  coverage:
    name: Code Coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ runner.os }}-cargo-coverage-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-coverage-

      - name: Setup MPICH
        uses: ./.github/actions/setup-mpich

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Run coverage (unit tests + MPI integration tests)
        run: |
          # shellcheck source=/dev/null
          source <(cargo llvm-cov show-env --export-prefix)
          cargo llvm-cov clean --workspace
          cargo test --lib --features numa
          MPI_NP_LIST=4 ./tests/run_mpi_tests.sh numa
          cargo llvm-cov report --lcov --output-path lcov.info

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          files: ./lcov.info
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}

  doc:
    name: Docs and package
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ runner.os }}-cargo-doc-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-doc-

      - name: Setup MPICH
        uses: ./.github/actions/setup-mpich

      - name: Doctests (default features)
        run: cargo test --doc

      - name: Doctests (all features)
        run: cargo test --doc --all-features

      - name: Documentation (default features)
        run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

      - name: Package allow-list
        run: |
          cargo package --locked
          cargo package --locked --list > "$RUNNER_TEMP/package-files"
          if grep -E '^(examples|benches|audits|tests|\.github)/|^test\.sh$' "$RUNNER_TEMP/package-files"; then
            exit 1
          fi

      - name: Install nightly toolchain
        uses: dtolnay/rust-toolchain@nightly

      - name: docs.rs emulation (nightly, all features)
        run: cargo +nightly doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: --cfg docsrs -D warnings

  valgrind:
    name: Valgrind (mpich)
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ runner.os }}-cargo-valgrind-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-valgrind-

      - name: Setup MPICH
        uses: ./.github/actions/setup-mpich

      - name: Install valgrind
        run: sudo apt-get install -y valgrind

      - name: Valgrind memcheck
        run: |
          chmod +x tests/run_mpi_tests.sh
          ./tests/run_mpi_tests.sh --valgrind rma
