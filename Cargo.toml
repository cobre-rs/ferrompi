[package]
name = "ferrompi"
version = "0.5.0"
edition = "2021"
rust-version = "1.85"
links = "ferrompi"
authors = ["Rogerio Alves"]
description = "Safe, generic Rust bindings for MPI, with MPI 4.0 persistent collectives, RMA and shared-memory windows, and hybrid MPI + threads"
license = "MIT OR Apache-2.0"
repository = "https://github.com/cobre-rs/ferrompi"
keywords = ["mpi", "hpc", "parallel", "distributed"]
categories = ["science", "concurrency"]
include = [
    "/src/**",
    "/csrc/**",
    "/docs/**",
    "/build.rs",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE-MIT",
    "/LICENSE-APACHE",
]

[[example]]
name = "test_rma_window"
required-features = ["rma"]

[[example]]
name = "test_rma_win_create"
required-features = ["rma"]

