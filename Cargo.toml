[package.metadata.docs.rs]
all-features = true

[dependencies]
thiserror = "2"

[build-dependencies]
cc = "1.2"
pkg-config = "0.3"

[dev-dependencies]
rand = "0.10"
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support", "html_reports", "plotters"] }

[[bench]]
name = "allreduce_roundtrip"
harness = false

[[bench]]
name = "persistent_vs_iallreduce"
harness = false

[[bench]]
name = "ffi_overhead"
harness = false

[features]
default = []
# Enable RMA (Remote Memory Access) shared memory window operations
rma = []
# SLURM helpers: the slurm module and SlurmInfo (implies rma)
numa = ["rma"]
