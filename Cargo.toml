[package.metadata.docs.rs]
all-features = true

[dependencies]
thiserror = "2"

[build-dependencies]
cc = "1.2"
pkg-config = "0.3"

[dev-dependencies]
rand = "0.10"
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support", "html_reports", "plotters"] }

[[bench]]
name = "bench_smoke"
harness = false

[[bench]]
name = "allreduce_roundtrip"
harness = false

[[bench]]
name = "persistent_vs_iallreduce"
harness = false

[[bench]]
name = "ffi_overhead"
harness = false

[features]
default = []
# Enable RMA (Remote Memory Access) shared memory window operations
rma = []
# Enable NUMA-aware shared memory windows and SLURM helpers (implies rma)
numa = ["rma"]

# Release profile tuned for a thin, latency-sensitive MPI wrapper.
#
# `codegen-units = 1` + `lto = "thin"` let the optimizer inline the wrapper
# bodies (the `validate -> single FFI call -> Error::check` shims) across
# codegen-unit boundaries within this crate, so the hot success path of every
# collective/p2p/RMA call folds to a return-code branch rather than an
# out-of-line call. This is the portable, Rust-only half of the FFI-overhead
# work; cross-LANGUAGE LTO (inlining the C trampolines into Rust) additionally
# requires a clang C toolchain whose LLVM matches rustc's plus
# `-C linker-plugin-lto`, which is not portable across the MPICH/Open MPI/Cray
# GCC toolchains ferrompi targets and is therefore intentionally not enabled
# here. The `bench` profile inherits these settings, so `benches/ffi_overhead.rs`
# measures the same configuration downstream users get from `--release`.
[profile.release]
lto = "thin"
codegen-units = 1
